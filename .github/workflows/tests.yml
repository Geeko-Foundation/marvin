name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django checks
        run: uv run python manage.py check

      # Only our own apps: a bare makemigrations --check also reports third-party
      # apps, which would want a migration written inside site-packages.
      - name: Models match their migrations
        run: uv run python manage.py makemigrations tsp profile payments --check --dry-run

      - name: Tests
        run: uv run python manage.py test --verbosity 2

  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marvin
          POSTGRES_PASSWORD: marvin
          POSTGRES_DB: marvin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: marvin
      DATABASE_USER: marvin
      DATABASE_PASSWORD: marvin
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra postgres

      - name: Tests
        run: uv run python manage.py test

  # The deploy installs from requirements.txt, not uv.lock, so a package added
  # to pyproject.toml alone would pass the tests above and break the live site.
  deploy-requirements:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install what the deploy installs
        run: pip install -r requirements.txt

      - name: The app starts with only those
        run: python manage.py check

  # The stylesheet is built by Tailwind and committed. A template that uses a
  # new class without a rebuild looks broken in production but passes tests.
  css-built:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "22"

      - name: Rebuild the stylesheet
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build:css

      - name: The committed stylesheet matches
        if: hashFiles('package.json') != ''
        run: git diff --exit-code static/css/app.css || (echo "Run npm run build:css and commit static/css/app.css." && exit 1)
