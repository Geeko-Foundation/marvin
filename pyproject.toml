[project]
name = "marvin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<7.0",
    "django-tables2>=2.7,<3.0",
    "django-webpush>=0.3.6,<0.4",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "cryptography>=43.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise>=6.7,<7.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
