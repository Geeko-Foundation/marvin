<form method="post" class="grid gap-4 mt-2">
  {% csrf_token %}
  {% for field in form %}
  <div class="form-control">
    <label class="label" for="{{ field.id_for_label }}"><span class="label-text">{{ field.label }}</span></label>
    {{ field }}
    {% for error in field.errors %}<span class="label-text-alt text-error mt-1">{{ error }}</span>{% endfor %}
  </div>
  {% endfor %}
  {% for error in form.non_field_errors %}<div class="alert alert-error"><span>{{ error }}</span></div>{% endfor %}
  <button type="submit" class="btn btn-primary w-full">{{ button }}</button>
</form>
