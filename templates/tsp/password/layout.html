{% extends "base.html" %}

{% block auth_content %}
<div class="min-h-screen grid place-items-center bg-base-200 px-4">
  <div class="card bg-base-100 w-full max-w-md shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl">{% block heading %}{% endblock %}</h1>
      {% block body %}{% endblock %}
      <a href="{% url 'login' %}" class="link text-sm mt-4">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
