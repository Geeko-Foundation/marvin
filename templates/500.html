<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something went wrong</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f4f6; color: #1f2937; padding: 24px; }
    main { background: #fff; border-radius: 12px; padding: 32px; max-width: 420px; text-align: center;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    p.code { color: #2c5282; font-weight: 600; font-size: 14px; margin: 0; }
    h1 { font-size: 22px; margin: 8px 0; }
    p { opacity: .75; line-height: 1.5; }
    a { display: inline-block; margin-top: 8px; background: #2c5282; color: #fff; padding: 10px 18px;
        border-radius: 8px; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #111827; color: #e5e7eb; } main { background: #1f2937; } }
  </style>
</head>
<body>
  <main>
    <p class="code">500</p>
    <h1>Something went wrong on our side</h1>
    <p>Nothing you did caused this. Please try again in a moment. If it keeps happening, let the committee know what you were doing.</p>
    <a href="/">Go to the dashboard</a>
  </main>
</body>
</html>
