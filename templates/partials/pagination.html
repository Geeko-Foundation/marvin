{% load tsp_tags %}
{% if page_obj.paginator.num_pages > 1 %}
<div class="flex justify-center mt-4">
  <div class="join">
    {% if page_obj.has_previous %}
    <a class="join-item btn" href="{% page_url param page_obj.previous_page_number %}">«</a>
    {% else %}
    <span class="join-item btn btn-disabled">«</span>
    {% endif %}
    <span class="join-item btn">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a class="join-item btn" href="{% page_url param page_obj.next_page_number %}">»</a>
    {% else %}
    <span class="join-item btn btn-disabled">»</span>
    {% endif %}
  </div>
</div>
{% endif %}
