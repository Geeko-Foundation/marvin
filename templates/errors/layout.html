<!DOCTYPE html>
<html lang="en" data-theme="{{ theme_light|default:'corporate' }}">
<head>
  {% include "partials/theme_init.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  {% include "partials/head_assets.html" %}
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-6">
  <main class="card bg-base-100 shadow-sm max-w-md w-full">
    <div class="card-body items-center text-center">
      <p class="text-sm font-semibold text-primary">{% block code %}{% endblock %}</p>
      <h1 class="text-2xl font-bold">{% block heading %}{% endblock %}</h1>
      <p class="opacity-70 py-2">{% block message %}{% endblock %}</p>
      <div class="card-actions">
        <a href="/" class="btn btn-primary">Go to the dashboard</a>
      </div>
    </div>
  </main>
</body>
</html>
